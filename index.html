<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leveridge</title>
    <style>
      :root { color-scheme: light; font-family: "Avenir Next", sans-serif; color: #182b28; background: #f4f7f6; }
      * { box-sizing: border-box; }
      body { margin: 0; border-top: 5px solid #087f68; }
      main { width: min(100% - 40px, 640px); margin: 80px auto; }
      h1 { font-size: 32px; margin: 0 0 32px; }
      form { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
      label { width: 100%; }
      input { min-width: 0; max-width: 100%; font: inherit; }
      button { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border: 0; border-radius: 6px; background: #087f68; color: white; font: inherit; cursor: pointer; }
      button:hover { background: #066552; }
      button:disabled { opacity: 0.6; cursor: wait; }
      button:focus-visible { outline: 3px solid #bc531c; outline-offset: 4px; }
      pre { min-height: 100px; margin-top: 24px; padding: 20px 0; border-top: 1px solid #cbd7d2; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react"
        }
      }
    </script>
    <script type="module">
      import { createElement, useState } from "react";
      import { createRoot } from "react-dom/client";

      function App() {
        const [file, setFile] = useState(null);
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState("No file uploaded.");

        async function handleRead(event) {
          event.preventDefault();
          if (!file || loading) return;
          if (!file.name.toLowerCase().endsWith(".pdf")) {
            setResult("Please upload a PDF file.");
            return;
          }
          setLoading(true);
          setResult("Uploading...");
          try {
            const formData = new FormData();
            formData.append("file", file);
            const response = await fetch("/read", { method: "POST", body: formData });
            if (!response.ok) throw new Error(`Request failed (${response.status})`);
            const data = await response.json();
            console.log(data);
            setResult(JSON.stringify(data, null, 2));
          } catch (error) {
            setResult(error.message);
          } finally {
            setLoading(false);
          }
        }

        return createElement("main", null,
          createElement("h1", null, "Leveridge"),
          createElement("form", { onSubmit: handleRead },
            createElement("label", { htmlFor: "pdf" }, "PDF file"),
            createElement("input", {
              id: "pdf",
              name: "file",
              type: "file",
              accept: ".pdf,application/pdf",
              required: true,
              disabled: loading,
              onChange: event => {
                setFile(event.target.files[0] ?? null);
                setResult("No file uploaded.");
              },
            }),
            createElement("button", {
              type: "submit",
              disabled: loading || !file,
            }, createElement("span", { "aria-hidden": true }, "\u2191"), " Upload"),
          ),
          createElement("pre", {
            id: "result",
            role: "status",
            "aria-live": "polite",
          }, result),
        );
      }

      createRoot(document.getElementById("root")).render(createElement(App));
    </script>
  </body>
</html>
